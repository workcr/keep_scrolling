name: Deploy to Hostinger

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (staging)
        run: npm run build:staging

      - name: Prepare deploy bundle
        run: |
          rm -rf deploy_bundle
          mkdir -p deploy_bundle
          cp -R dist/. deploy_bundle/
          cat > deploy_bundle/.htaccess <<'HTACCESS'
          RewriteEngine On
          RewriteBase /staging/
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /staging/index.html [L]
          HTACCESS

      - name: Deploy to Hostinger (staging)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_STAGING_HOST || vars.HOSTINGER_STAGING_HOST || 'ftp://195.35.39.18' }}
          username: ${{ secrets.HOSTINGER_STAGING_USER || secrets.HOSTINGER_STAGING_USERNAME || vars.HOSTINGER_STAGING_USER || vars.HOSTINGER_STAGING_USERNAME || 'u778371618.keep-scrolling.com' }}
          password: ${{ secrets.HOSTINGER_STAGING_PASSWORD || vars.HOSTINGER_STAGING_PASSWORD }}
          protocol: ${{ secrets.HOSTINGER_STAGING_PROTOCOL || vars.HOSTINGER_STAGING_PROTOCOL || 'ftps' }}
          port: ${{ secrets.HOSTINGER_STAGING_PORT || vars.HOSTINGER_STAGING_PORT || '21' }}
          local-dir: ./deploy_bundle/
          server-dir: ${{ secrets.HOSTINGER_STAGING_PATH || vars.HOSTINGER_STAGING_PATH || '/public_html/staging/' }}
          exclude: |
            **/.DS_Store
            **/.git*
            **/node_modules/**
            **/*.mov

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build:prod

      - name: Prepare deploy bundle
        run: |
          rm -rf deploy_bundle
          mkdir -p deploy_bundle/assets
          cp -R dist/. deploy_bundle/
          cp -R src/assets/. deploy_bundle/assets/
          cat > deploy_bundle/.htaccess <<'HTACCESS'
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          HTACCESS

      - name: Deploy to Hostinger (production)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_PROD_HOST || vars.HOSTINGER_PROD_HOST || 'ftp://195.35.39.18' }}
          username: ${{ secrets.HOSTINGER_PROD_USER || secrets.HOSTINGER_PROD_USERNAME || vars.HOSTINGER_PROD_USER || vars.HOSTINGER_PROD_USERNAME || 'u778371618.keep-scrolling.com' }}
          password: ${{ secrets.HOSTINGER_PROD_PASSWORD || vars.HOSTINGER_PROD_PASSWORD }}
          protocol: ${{ secrets.HOSTINGER_PROD_PROTOCOL || vars.HOSTINGER_PROD_PROTOCOL || 'ftps' }}
          port: ${{ secrets.HOSTINGER_PROD_PORT || vars.HOSTINGER_PROD_PORT || '21' }}
          local-dir: ./deploy_bundle/
          server-dir: ${{ secrets.HOSTINGER_PROD_PATH || vars.HOSTINGER_PROD_PATH || '/public_html/' }}
          exclude: |
            **/.DS_Store
            **/.git*
            **/node_modules/**
            **/*.mov
