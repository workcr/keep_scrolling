name: Studio

# Tests the Studio on every pull request that touches it, and deploys it to
# Cloudflare when Studio changes reach main (or when run by hand).
# Deploying needs two repository secrets, added during setup:
#   CLOUDFLARE_API_TOKEN   token that can edit Workers, D1 and R2
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
# Until they exist (and wrangler.toml has the D1 database id), the deploy job
# says so and skips instead of failing.

on:
  pull_request:
    paths:
      - "studio/**"
      - "src/data/scroll-items.json"
      - ".github/workflows/studio.yml"
  push:
    branches:
      - main
    paths:
      - "studio/**"
      - ".github/workflows/studio.yml"
  workflow_dispatch:

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: studio
    defaults:
      run:
        working-directory: studio
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci

      - name: Check setup
        id: setup
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Studio not deployed: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets first (see docs/STUDIO-PLAN.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
            echo "::notice::Studio not deployed: put the D1 database id in studio/wrangler.toml first."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the drafts database
        if: steps.setup.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply keep-scrolling-studio --remote

      - name: Deploy the Studio
        if: steps.setup.outputs.ready == 'true'
        run: npx wrangler deploy
